<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="logo.png" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <title>Sign Up — Monastery360</title>
  <style>
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --muted:#94a3b8;
      --accent:#f59e0b;
      --accent-600:#d97706;
      --white:#ffffff;
      --glass: rgba(255,255,255,0.03);
    }
    *{box-sizing:border-box;}
    body{
      margin:0;
      font-family:'Cinzel','Inter',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
      background: linear-gradient(180deg,#071029 0%, #071a2e 100%);
      color: var(--white);
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }
    .wrap{
      width:100%;
      max-width:400px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:14px;
      padding:28px;
      box-shadow: 0 8px 30px rgba(2,6,23,0.6);
      border:1px solid rgba(255,255,255,0.04);
    }
    header{
      display:flex;
      align-items:center;
      gap:16px;
      margin-bottom:18px;
    }
    .logo{
      width:56px;
      height:56px;
      border-radius:10px;
      background: linear-gradient(135deg,var(--accent),var(--accent-600));
      display:flex;
      justify-content:center;
      align-items:center;
      font-weight:700;
      color:var(--bg);
      font-size:20px;
    }
    h1{margin:0;font-size:20px;}
    p.lead{margin:6px 0 20px;color:var(--muted);font-size:14px;}

    form{display:flex;flex-direction:column;gap:12px;}
    label{display:block;margin-bottom:4px;color:var(--muted);font-size:13px;}
    input[type="text"], input[type="email"], input[type="password"]{
      width:100%;
      padding:10px 12px;
      border-radius:8px;
      border:1px solid rgba(255,255,255,0.06);
      background:transparent;
      color:var(--white);
      font-size:14px;
      outline:none;
    }
    .submit-row{
      margin-top:12px;
      display:flex;
      flex-direction:column;
      gap:12px;
      align-items:center;
    }
    .signup-btn{
      background: linear-gradient(90deg,var(--accent),var(--accent-600));
      color:var(--bg);
      border:none;
      padding:10px 18px;
      border-radius:10px;
      font-weight:700;
      cursor:pointer;
      box-shadow:0 8px 24px rgba(215,119,6,0.16);
      font-size:15px;
      width:100%;
    }
    .signup-btn:active{transform:translateY(1px);}
    .note{font-size:13px;color:var(--muted);text-align:center;}
    .note a{color:var(--accent); text-decoration:underline;}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">M</div>
      <div>
        <h1>Create Your Account</h1>
        <p class="lead">Sign up to access Monastery360 and preserve Sikkim’s heritage.</p>
      </div>
    </header>

    <form id="signupForm" novalidate>
      <div>
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Your full name" required>
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div>
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required>
      </div>
      <div>
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm password" required>
      </div>

      <div class="submit-row">
        <button type="submit" class="signup-btn">Sign Up</button>
        <div class="note">
          By signed in, you agree to our <a href="term.html" style="color:var(--accent)">terms</a>.<br>
          Already have an account? <a href="login.html">Log in</a>
        </div>
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById('signupForm');

    form.addEventListener('submit', (e)=>{
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if(!name || !email || !password || !confirmPassword){
        alert('Please fill all fields.');
        return;
      }

      if(password !== confirmPassword){
        alert('Passwords do not match!');
        return;
      }

      // Simulate signup success
      alert(`Account created successfully!\nWelcome, ${name}`);
      form.reset();
      // redirect to login page
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
