<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monastery 3D Tour</title>
    <link rel="shortcut icon" href="../src/logo.png" type="image/x-icon" />

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap');

        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: #1a202c; /* Dark Slate Blue */
            color: #a0aec0; /* Light Slate Gray */
            overflow-x: hidden;
        }

        .tour-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #1a202c;
        }

        /* All main viewers share these styles for smooth transitions */
        model-viewer, #video-viewer {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 1.5s ease-in-out; /* Slower transition for VR feel */
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        model-viewer { z-index: 1; --progress-bar-color: #63b3ed; } /* Calming Blue */
        
        #video-viewer { z-index: 2; display: flex; justify-content: center; align-items: center; }
        #main-video { width: 100%; height: 100%; object-fit: cover; }

        .splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #1a202c; display: flex; flex-direction: column; justify-content: center;
            align-items: center; z-index: 100;
            animation: fadeOut 1.5s ease-out 2.5s forwards;
        }
        .splash-screen h1 { 
            font-size: 3rem; text-transform: uppercase; letter-spacing: 5px; 
            text-align: center; padding: 10px; color: #63b3ed; 
            margin: 0; width: 100%; 
        }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

        .top-bar, .bottom-bar { 
            position: absolute; left: 0; width: 100%; padding: 20px 30px; 
            box-sizing: border-box; z-index: 10; transition: opacity 0.5s ease-in-out; 
        }
        .top-bar { 
            top: 0; background: linear-gradient(to bottom, rgba(26, 32, 44, 0.8), transparent); 
            display: flex; align-items: center; justify-content: flex-start; gap: 20px; 
        }
        #logo { height: 45px; width: 45px; filter: drop-shadow(0 0 8px rgba(99, 179, 237, 0.6)); }
        #main-title { 
            font-size: 1.5rem; margin: 0; letter-spacing: 2px; color: #e2e8f0; 
            text-align: left; 
        }
        .bottom-bar { 
            bottom: 0; height: 160px; 
            background: linear-gradient(to top, rgba(26, 32, 44, 0.9), transparent); 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .nav-controls { display: flex; align-items: center; justify-content: center; gap: 20px; }
        .nav-button { 
            font-size: 2.5rem; cursor: pointer; color: #63b3ed; 
            transition: color 0.3s ease; user-select: none; 
            display: flex; align-items: center; justify-content: center;
        }
        .nav-button:hover { color: #bee3f8; } /* Lighter Blue */
        
        .scene-info {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .scene-info h2 { 
            margin: 0; font-size: 1.8rem; letter-spacing: 1px; color: #e2e8f0; 
            text-align: center; 
        }
        .scene-info p { 
            margin: 5px 0 0; font-size: 1rem; opacity: 0.8; 
            text-align: center; 
        }

        #enter-video-cta {
            margin-top: 10px;
            z-index: 20;
            transition: opacity 0.5s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #enter-video-cta button {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem; /* Resized for footer */
            color: #bee3f8;
            background-color: rgba(45, 55, 72, 0.8); /* Darker Slate */
            border: 2px solid #63b3ed;
            padding: 8px 18px; /* Resized for footer */
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #enter-video-cta button:hover {
            background-color: #63b3ed;
            color: #1a202c;
            box-shadow: 0 0 20px rgba(99, 179, 237, 0.5);
        }

        .gallery-section { 
            padding: 80px 20px; background-color: #2d3748; 
            text-align: center; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
        }
        .gallery-section h2 { 
            font-size: 2.5rem; margin-bottom: 50px; border-bottom: 1px solid #63b3ed; 
            display: inline-block; padding-bottom: 10px; color: #e2e8f0; 
            text-align: center; 
        }
        .gallery-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); 
            gap: 30px; max-width: 1200px; margin: 0 auto; 
            width: 100%; justify-items: center; 
        }
        .gallery-item { 
            background-color: #1a202c; border: 1px solid #4a5568; border-radius: 8px; 
            overflow: hidden; transition: transform 0.3s ease, box-shadow 0.3s ease; 
            text-align: center; text-decoration: none; display: flex; 
            flex-direction: column; align-items: center; justify-content: center; 
            width: 100%; max-width: 400px; 
        }
        .gallery-item:hover { transform: translateY(-10px); box-shadow: 0 10px 20px rgba(99, 179, 237, 0.2); border-color: #63b3ed; }
        .gallery-item img { width: 100%; height: 250px; object-fit: cover; display: block; }
        .gallery-item h3 { 
            font-size: 1.5rem; margin: 20px; color: #e2e8f0; 
            text-align: center; width: 100%; 
        }

        /* Mobile Responsive Styles */
        @media (max-width: 768px) {
            body {
                font-size: 14px;
            }

            .splash-screen h1 {
                font-size: 2rem;
                letter-spacing: 3px;
                padding: 0 20px;
            }

            .top-bar {
                padding: 15px 20px;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 10px;
                text-align: center;
            }

            #logo {
                height: 35px;
                width: 35px;
            }

            #main-title {
                font-size: 1.2rem;
                letter-spacing: 1px;
                text-align: center;
                margin: 0;
            }

            .bottom-bar {
                height: 140px;
                padding: 15px 20px;
                flex-direction: column;
                gap: 15px;
                justify-content: center;
                align-items: center;
            }

            .nav-controls {
                gap: 15px;
                justify-content: center;
            }

            .nav-button {
                font-size: 2rem;
            }

            .scene-info {
                order: -1;
                width: 100%;
                text-align: center;
            }

            .scene-info h2 {
                font-size: 1.4rem;
                margin-bottom: 5px;
                text-align: center;
            }

            .scene-info p {
                font-size: 0.9rem;
                text-align: center;
            }

            #enter-video-cta button {
                font-size: 0.8rem;
                padding: 6px 14px;
                letter-spacing: 1px;
            }

            .gallery-section {
                padding: 40px 15px;
            }

            .gallery-section h2 {
                font-size: 1.8rem;
                margin-bottom: 30px;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
                gap: 20px;
                max-width: 100%;
                justify-items: center;
                align-items: center;
            }

            .gallery-item img {
                height: 200px;
            }

            .gallery-item h3 {
                font-size: 1.2rem;
                margin: 15px;
            }

            /* Make touch targets larger on mobile */
            .nav-button {
                padding: 10px;
                min-width: 44px;
                min-height: 44px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            #enter-video-cta button {
                min-width: 44px;
                min-height: 44px;
            }
        }

        @media (max-width: 480px) {
            .splash-screen h1 {
                font-size: 1.5rem;
                letter-spacing: 2px;
            }

            .top-bar {
                padding: 10px 15px;
                text-align: center;
                justify-content: center;
                align-items: center;
            }

            #main-title {
                font-size: 1rem;
                text-align: center;
            }

            .bottom-bar {
                height: 120px;
                padding: 10px 15px;
                justify-content: center;
                align-items: center;
            }

            .scene-info h2 {
                font-size: 1.2rem;
                text-align: center;
            }

            .scene-info p {
                font-size: 0.8rem;
                text-align: center;
            }

            .nav-button {
                font-size: 1.8rem;
            }

            .gallery-section {
                padding: 30px 10px;
            }

            .gallery-section h2 {
                font-size: 1.5rem;
                margin-bottom: 20px;
            }

            .gallery-item img {
                height: 180px;
            }

            .gallery-item h3 {
                font-size: 1.1rem;
                margin: 12px;
            }
        }
        
    </style>
</head>

<body>

    <div class="splash-screen">
        <h1>Welcome to the 3D View</h1>
    </div>

    <div class="tour-container">
        <model-viewer id="monastery-viewer" class="hidden" src="3d tour.glb" alt="A 3D model of a monastery" shadow-intensity="1" camera-controls auto-rotate></model-viewer>
        
        <div id="video-viewer" class="hidden">
            <video id="main-video" controls loop muted src="INTERIOR TOUR DUBDI.mp4"></video>
        </div>

        <audio id="background-audio" loop src="SOUND.m4a"></audio>

        <header class="top-bar">
            <svg id="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g stroke-width="5" stroke="#63b3ed" fill="none"><circle cx="50" cy="50" r="45" /><circle cx="50" cy="50" r="25" /><path d="M50 25 a25 25 0 0 1 21.65 12.5" /><path d="M50 25 a25 25 0 0 0 -21.65 12.5" /><path d="M28.35 62.5 a25 25 0 0 0 21.65 12.5" /><path d="M28.35 62.5 a25 25 0 0 1 -21.65 -12.5" /><path d="M71.65 37.5 a25 25 0 0 1 21.65 12.5" /><path d="M71.65 37.5 a25 25 0 0 0 -21.65 -12.5" /><path d="M50 75 a25 25 0 0 0 21.65 -12.5" /><path d="M50 75 a25 25 0 0 1 -21.65 -12.5" /></g></svg>
            <h1 id="main-title">3D View of Monastery</h1>
        </header>

        <footer class="bottom-bar">
            <div class="nav-controls">
                <div id="nav-prev" class="nav-button">&#x25C0;</div>
                <div id="nav-next" class="nav-button">&#x25B6;</div>
            </div>
            <div class="scene-info">
                <h2 id="scene-title"></h2>
                <p id="scene-subtitle"></p>
                <div id="enter-video-cta" class="hidden">
                    <button>Watch Interior Tour</button>
                </div>
            </div>
            <!-- This is an invisible spacer to keep the title centered -->
            <div class="nav-controls" style="visibility: hidden;">
                <div class="nav-button">&#x25C0;</div>
                <div class="nav-button">&#x25B6;</div>
            </div>
        </footer>
    </div>

    <section class="gallery-section">
        <h2>Explore More Monasteries</h2>
        <div class="gallery-grid">
            <a class="gallery-item" href="../notAvailable.html">
                <img src="RUMTEKNANO.png" alt="RUMTEK Monastery">
                <h3>RUMTEK MONASTERY</h3>
            </a>
            <a class="gallery-item" href="../notAvailable.html">
                <img src="TASHIDINGNANO.png" alt="TASHIDING Monastery">
                <h3>TASHIDING MONASTERY</h3>
            </a>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const viewer = document.getElementById('monastery-viewer');
            const videoViewer = document.getElementById('video-viewer');
            const mainVideo = document.getElementById('main-video');
            const backgroundAudio = document.getElementById('background-audio');
            
            // This data now comes from a simple array since the thumbnails are gone
            const scenes = [
                { type: 'model', src: '3d tour.glb', title: 'DUBDI MONASTERY', subtitle: 'Exterior 3D View', poster: '' },
                { type: 'video', src: 'INTERIOR TOUR DUBDI.mp4', title: 'INTERIOR PART', subtitle: 'Interior Video Tour', poster: 'https://images.unsplash.com/photo-1547202301-3a33502d_535b?q=80&w=2070&auto-format&fit=crop' },
                { type: 'video', src: 'EXTERIOR.mp4', title: 'EXTERIOR TOUR', subtitle: 'Exterior Video View', poster: 'https://images.unsplash.com/photo-1549622228-d8a43c83495a?q=80&w=2070&auto-format&fit=crop' }
            ];

            const sceneTitle = document.getElementById('scene-title');
            const sceneSubtitle = document.getElementById('scene-subtitle');
            const prevButton = document.getElementById('nav-prev');
            const nextButton = document.getElementById('nav-next');
            const ctaButton = document.getElementById('enter-video-cta');
            let currentSceneIndex = 0;

            function switchScene(index) {
                const scene = scenes[index];
                if (!scene) return;

                // Pause video and audio when switching away
                mainVideo.pause();
                backgroundAudio.pause();

                if (index === 0) { // If it's the 3D model
                    ctaButton.classList.remove('hidden');
                } else {
                    ctaButton.classList.add('hidden');
                }

                if (scene.type === 'model') {
                    viewer.classList.remove('hidden');
                    videoViewer.classList.add('hidden');
                    if (!viewer.src || !viewer.src.endsWith(scene.src)) {
                        viewer.src = scene.src;
                    }
                    viewer.autoRotate = true; // Ensure auto-rotate is enabled
                    setTimeout(() => backgroundAudio.play().catch(e => console.error("Audio play failed:", e)), 1500);
                } else if (scene.type === 'video') {
                    viewer.classList.add('hidden');
                    videoViewer.classList.remove('hidden');
                    mainVideo.poster = scene.poster || ''; // Set the poster image
                    mainVideo.src = scene.src;
                    mainVideo.play().catch(e => console.error("Video play failed:", e));
                }

                sceneTitle.textContent = scene.title;
                sceneSubtitle.textContent = scene.subtitle;
                
                currentSceneIndex = index;
            }
            
            // --- Initial Setup ---
            switchScene(0);
            
            // --- Event Listeners ---
            ctaButton.addEventListener('click', () => {
                switchScene(1); // Go to the first video
            });

            nextButton.addEventListener('click', () => {
                const nextIndex = (currentSceneIndex + 1) % scenes.length;
                switchScene(nextIndex);
            });

            prevButton.addEventListener('click', () => {
                const prevIndex = (currentSceneIndex - 1 + scenes.length) % scenes.length;
                switchScene(prevIndex);
            });
        });
    </script>

</body>
</html>
