<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="src/logo.png" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <title>Login — Monastery360</title>
  <style>
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --muted:#94a3b8;
      --accent:#f59e0b;
      --accent-600:#d97706;
      --white:#ffffff;
      --glass: rgba(255,255,255,0.03);
    }

    *{box-sizing:border-box;}
    body{
      margin:0;
      font-family:'Cinzel','Inter',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
      background: linear-gradient(180deg,#071029 0%, #071a2e 100%);
      color:var(--white);
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
      padding:20px;
    }

    .wrap{
      width:100%;
      max-width:400px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:14px;
      padding:28px;
      box-shadow: 0 8px 30px rgba(2,6,23,0.6);
      border: 1px solid rgba(255,255,255,0.04);
    }

    header{
      display:flex;
      align-items:center;
      gap:16px;
      margin-bottom:18px;
    }
    .logo{
      width:50px;
      height:50px;
      border-radius:10px;
      background: linear-gradient(135deg,var(--accent),var(--accent-600));
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
      color:var(--bg);
      font-size:20px;
    }
    h1{margin:0;font-size:20px;}
    p.lead{margin:6px 0 20px;color:var(--muted);font-size:14px;text-align:center;}

    form{
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    label{display:block;margin-bottom:6px;color:var(--muted);font-size:13px;}
    input[type="text"], input[type="password"]{
      width:100%;
      padding:10px 12px;
      border-radius:8px;
      border:1px solid rgba(255,255,255,0.06);
      background:transparent;
      color:var(--white);
      outline:none;
      font-size:14px;
    }

    .login-btn{
      background: linear-gradient(90deg,var(--accent),var(--accent-600));
      color:var(--bg);
      border:none;
      padding:10px 18px;
      border-radius:10px;
      font-weight:700;
      cursor:pointer;
      font-size:15px;
      transition:transform .12s ease, box-shadow .12s ease;
    }
    .login-btn:active{transform:translateY(1px);}
    
    .note{font-size:13px;color:var(--muted);text-align:center;}
    .forgot{
      font-size:13px;
      color:var(--accent);
      text-align:right;
      cursor:pointer;
      text-decoration:underline;
    }

    .overlay{
      position:fixed;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      background:rgba(2,6,23,0.6);
      z-index:1200;
    }
    .overlay.show{display:flex;}
    .modal{
      width:90%;
      max-width:400px;
      background:linear-gradient(180deg,#041226,#06182b);
      padding:22px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.04);
      text-align:center;
      box-shadow:0 18px 50px rgba(2,6,23,0.72);
    }
    .close{
      cursor:pointer;
      background:transparent;
      border:1px solid rgba(255,255,255,0.06);
      padding:8px 14px;
      border-radius:8px;
      color:var(--white);
      font-weight:600;
      margin-top:16px;
    }
  </style>
</head>
<body>

  <div class="wrap">
    <header>
      <div class="logo">M</div>
      <h1>Login to Monastery360</h1>
    </header>
    <p class="lead">Enter your credentials to access your account.</p>

    <form id="loginForm" novalidate>
      <div>
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your username" required>
      </div>

      <div>
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>

      <div class="forgot" onclick="alert('Reset link sent to your email!')">Forgot password?</div>

      <button type="submit" class="login-btn">Login</button>
      <div class="note">
        By logging in, you agree to our <a href="term.html" style="color:var(--accent)">terms</a>.<br>
        New user? <a href="sign up.html" style="color:var(--accent); text-decoration:underline;">Sign up</a>
      </div>

    </form>
  </div>

  <!-- Modal -->
  <div id="overlay" class="overlay">
    <div class="modal">
      <h3>Login Successful ✅</h3>
      <p>Welcome back, <span id="userDisplay"></span>!</p>
      <button id="closeModal" class="close">Close</button>
    </div>
  </div>

<script>
  const form = document.getElementById('loginForm');
  const overlay = document.getElementById('overlay');
  const closeModal = document.getElementById('closeModal');
  const userDisplay = document.getElementById('userDisplay');

  // Get redirect URL from query params
  const urlParams = new URLSearchParams(window.location.search);
  const redirectURL = urlParams.get('redirect') || 'index.html'; 

  form.addEventListener('submit', (e) => {
    e.preventDefault();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!username || !password) {
      alert('Please enter username and password.');
      return;
    }

    // Show modal
    userDisplay.textContent = username;
    overlay.classList.add('show');

    localStorage.setItem('loggedInUser', username);

    // Redirect after 1.5 seconds
    setTimeout(() => {
      window.location.href = redirectURL;
    }, 1500);
  });

  closeModal.addEventListener('click', () => {
    overlay.classList.remove('show');
    form.reset();
  });
</script>


</body>
</html>
